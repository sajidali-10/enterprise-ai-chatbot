# ==============================================================================
# Enterprise AI Chatbot — Docker Compose Configuration
# ==============================================================================
# This file defines all services required for Phase 0 foundation:
# - PostgreSQL: Primary relational database
# - Qdrant: Vector database for RAG embeddings (deferred Phase 1)
# - Redis: Caching and session store
# - MinIO: S3-compatible object storage for document uploads (deferred Phase 1)
# - Backend: FastAPI application server
# - Frontend: Next.js application
# ==============================================================================

services:
  # --------------------------------------------------------------------------
  # PostgreSQL — Primary Database
  # --------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: chatbot_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Qdrant — Vector Database
  # --------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:latest
    container_name: chatbot_qdrant
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "${QDRANT_PORT:-6333}:6333"
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD-SHELL", "bash -c 'cat < /dev/null > /dev/tcp/localhost/6333' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Redis — Caching & Session Store
  # --------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: chatbot_redis
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # MinIO — S3-Compatible Object Storage
  # --------------------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: chatbot_minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    volumes:
      - minio_data:/data
    ports:
      - "9000:9000"   # API port
      - "9001:9001"   # Console port
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # LiteLLM Gateway — Unified LLM Proxy (Phase 15)
  # --------------------------------------------------------------------------
  litellm:
    image: ghcr.io/berriai/litellm:main-latest
    container_name: chatbot_litellm
    environment:
      # LiteLLM master key — clients must provide this to authenticate
      LITELLM_MASTER_KEY: ${LITELLM_MASTER_KEY:-changeme_litellm_master_key}
      # Database for LiteLLM proxy state (in-memory fallback is fine for single instance)
      DATABASE_URL: ${DATABASE_URL:-postgresql://chatbot:changeme@postgres:5432/chatbot}
      # OpenRouter API key for OpenRouter-backed models (loaded via config.yaml env var)
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      # Optional: LiteLLM UI credentials
      # Optional: disable LiteLLM admin UI (set to 'true' to enable)
      LITELLM_DISABLE_ADMIN_UI: "true"
      # Store model credentials in database instead of config file
      LITELLM_MODEL_STORES: "database"
      # Disable LiteLLM's built-in telemetry
      LITELLM_TELEMETRY: "false"
      LITELLM_AUDIT_LOGGING: "true"
    volumes:
      - ./infra/litellm/config.yaml:/app/config.yaml:ro
    command: --config /app/config.yaml --port 4000 --detailed_debug false
    ports:
      - "${LITELLM_EXTERNAL_PORT:-4000}:4000"  # External port only if LITELLM_EXTERNAL_PORT is set
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:4000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Nginx — HTTPS Reverse Proxy (Phase 17)
  # --------------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: chatbot_nginx
    depends_on:
      - frontend
      - backend
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infra/nginx/conf.d:/etc/nginx/conf.d:ro
      - ./infra/nginx/ssl:/etc/nginx/ssl:ro
    ports:
      - "80:80"
      - "443:443"
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Backend — FastAPI Application
  # --------------------------------------------------------------------------
  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    container_name: chatbot_backend
    environment:
      - PYTHONUNBUFFERED=1
      - HF_HOME=/tmp/hf_home
      - TRANSFORMERS_CACHE=/tmp/hf_home/transformers
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_started  # Allow startup without strict health dependency for Phase 0
      redis:
        condition: service_started
      qdrant:
        condition: service_started
      minio:
        condition: service_started
      litellm:
        condition: service_started  # LiteLLM Gateway — backend will still work via direct OpenRouter if litellm is unavailable
    networks:
      - chatbot-network
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    restart: unless-stopped

  # --------------------------------------------------------------------------
  # Frontend — Next.js Application
  # --------------------------------------------------------------------------
  frontend:
    build:
      context: ./apps/frontend
      dockerfile: Dockerfile
    container_name: chatbot_frontend
    depends_on:
      - backend
    env_file:
      - .env
    environment:
      - HOST=0.0.0.0
    networks:
      - chatbot-network
    restart: unless-stopped

# ==============================================================================
# Networks
# ==============================================================================
networks:
  chatbot-network:
    driver: bridge

# ==============================================================================
# Volumes
# ==============================================================================
volumes:
  postgres_data:
  qdrant_data:
  redis_data:
  minio_data: