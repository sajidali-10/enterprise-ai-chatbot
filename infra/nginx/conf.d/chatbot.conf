# ==============================================================================
# Enterprise AI Chatbot — Nginx Reverse Proxy Configuration
# ==============================================================================
# Routes:
#   /api/*      → backend:8000/api/*
#   /health     → backend:8000/health
#   /           → frontend:3000
#
# Dynamic upstream resolution: Docker service names (backend, frontend) can
# change IP after container recreation. We use variable-based proxy_pass so
# Nginx re-resolves DNS on every request using Docker's internal DNS
# resolver (127.0.0.11). This prevents stale cached IPs that cause 502s.
# ==============================================================================

# HTTP server — redirect all traffic to HTTPS
server {
    listen 80 default_server;
    server_name _;

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS server
server {
    listen 443 ssl default_server;
    server_name _;

    # Docker DNS resolver — re-resolves backend/frontend on every request.
    # This prevents stale Docker IPs after container recreation.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ---------------------------------------------------------------------
    # SSL Configuration
    # ---------------------------------------------------------------------
    ssl_certificate /etc/nginx/ssl/fullchain.crt;
    ssl_certificate_key /etc/nginx/ssl/private.key;

    # Modern TLS configuration
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP Stapling (if your certificate supports it)
    # ssl_stapling on;
    # ssl_stapling_verify on;

    # ---------------------------------------------------------------------
    # Security Headers
    # ---------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    # Permissions-Policy: disable unnecessary browser features
    add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;

    # ---------------------------------------------------------------------
    # Base Proxy Configuration
    # ---------------------------------------------------------------------
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header Connection "";

    # Timeouts — allow RAG/chat responses to take time
    proxy_connect_timeout 60s;
    proxy_send_timeout 180s;
    proxy_read_timeout 180s;

    # Buffering — prevent client timeouts during large responses
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 24k;

    # Body size limit allows 20MB backend uploads plus multipart overhead.
    client_max_body_size 25M;

    # ---------------------------------------------------------------------
    # Routes — variable-based proxy_pass ensures Docker DNS re-resolution
    # ---------------------------------------------------------------------

    # Health endpoint — backend only, no frontend involvement
    location = /health {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream/health;
    }

    # API routes — backend
    location /api/ {
        set $backend_upstream http://backend:8000;
        proxy_pass $backend_upstream$request_uri;
        # Do NOT cache API responses
        proxy_no_cache 1;
        proxy_cache_bypass 1;
    }

    # Everything else — frontend (supports WebSocket upgrades via Upgrade header)
    location / {
        set $frontend_upstream http://frontend:3000;
        proxy_pass $frontend_upstream$request_uri;
        # WebSocket support for Next.js hot-reload and real-time features
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}